<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Touhou - Catalogue</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="upheader">
      <img class="logo" src="../Image/assets/logo.png" alt="Logo Touhou">
    </div>
    <div class="navigation">
      <nav class="nav-main">
        <a href="/"><span class="nf"></span> Accueil</a>
        <a href="/panier"><span class="nf">󱗫</span> Panier</a>
        <a href="/favoris"><span class="nf"></span> Favoris</a>
      </nav>  
  </header>

  <main>
    <!-- Filtres -->
    <section id="filtres">
      <select id="filtreCategorie">
        <option value="">Toutes les catégories</option>
        <option value="Plush">FUMO</option>
        <option value="Mangas">Mangas</option>
        <option value="jeux">Jeux</option>
      </select>

      <select id="filtreSexe">
        <option value="">Homme / Femme</option>
        <option value="homme">Homme</option>
        <option value="femme">Femme</option>
      </select>

      <select id="tri">
        <option value="">Trier par</option>
        <option value="prixAsc">Prix croissant</option>
        <option value="prixDesc">Prix décroissant</option>
        <option value="nom">Nom A-Z</option>
      </select>
    </section>

    <!-- Liste produits -->
    <section class="catalogue" id="catalogue"></section>
  </main>

  <script src="../js/catalogue.js"></script>
</body>
</html>
